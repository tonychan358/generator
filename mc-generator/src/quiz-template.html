<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>/* {{QUIZ_TITLE}} */ - /* {{QUIZ_SUBJECT}} */</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    /* {{QUIZ_CSS}} */
  </style>
  <style>
    :root {
      --primary-color: /* {{THEME_PRIMARY}} */;
      --primary-hover: /* {{THEME_PRIMARY_HOVER}} */;
      --primary-light: /* {{THEME_PRIMARY_LIGHT}} */;
      --bg-gradient-start: /* {{THEME_BG_START}} */;
      --bg-gradient-end: /* {{THEME_BG_END}} */;
      --accent-bg: /* {{THEME_ACCENT_BG}} */;
      --shadow-color: /* {{THEME_SHADOW_COLOR}} */;
    }
  </style>
</head>
<body>

  <header>
    <div class="lang-switch" id="lang-switch-wrapper" style="display: none;">
      <button class="lang-btn active" id="btn-lang-cn" onclick="switchLanguage('cn')">中</button>
      <button class="lang-btn" id="btn-lang-en" onclick="switchLanguage('en')">EN</button>
    </div>
  </header>

  <main>
    <!-- 大廳大卡片 (Welcome/Lobby) -->
    <div class="quiz-card lobby-card" id="lobby-section">
      <div class="lobby-badge" id="lobby-mode-tag">大氣物理</div>
      <h2 class="lobby-title" id="lobby-main-title">/* {{QUIZ_TITLE}} */</h2>
      <p class="lobby-subject" id="lobby-sub-subject">/* {{QUIZ_SUBJECT}} */</p>
      
      <div class="lobby-input-group">
        <label for="student-name" id="label-student-name">學生姓名 / Student Name</label>
        <input type="text" id="student-name" placeholder="請輸入姓名 / Enter your name" oninput="toggleStartButton()">
      </div>
      
      <button class="btn-start" id="btn-start-quiz" onclick="startQuiz()" disabled>開始作答 / Start</button>
    </div>

    <!-- 結算卡片 -->
    <div class="summary-card" id="summary-section">
      <h2 id="summary-title">練習完成！</h2>
      <div class="summary-student-name" id="summary-student-display">同學：張小明</div>
      <div class="summary-score" id="summary-score-value">90%</div>
      <p class="summary-comment" id="summary-comment-text">表現優異！繼續保持！</p>
      
      <!-- 未合格提示區 -->
      <div class="retry-hint" id="retry-hint" style="display: none;"></div>
      
      <!-- 證書展示區 -->
      <div class="certificate-container" id="cert-container">
        <p class="cert-instruction" id="cert-instruction-text">🏆 恭喜完成！長按下方證書可儲存為圖片<br>Long press the certificate below to save it as an image</p>
        <div class="cert-img-wrapper">
          <img id="cert-image" src="" alt="Certificate">
        </div>
      </div>

      <button class="btn-retry" onclick="resetQuiz()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
        </svg>
        <span id="btn-retry-text">重新挑戰</span>
      </button>
    </div>

    <!-- 題目導覽網格 -->
    <div class="nav-grid" id="nav-grid-container" style="display: none;"></div>

    <!-- 題目列表 -->
    <div id="questions-container" style="display: none;"></div>
    
    <!-- 全答完提交按鈕 (長卷模式用) -->
    <div class="all-submit-container" id="all-submit-section" style="display: none;">
      <button class="btn-submit-all" id="btn-submit-all-quiz" onclick="confirmAndSubmitAll()">提交所有答案 / Submit Quiz</button>
    </div>
  </main>

  <!-- 懸浮計分板 -->
  <div class="score-bar" id="score-bar" style="display: none;">
    <div class="score-progress" id="ui-progress">
      答題進度: <span id="progress-val">0 / 0</span>
    </div>
    <div class="score-num" id="ui-score">
      目前得分: <span id="score-val">0</span>
    </div>
  </div>

  <footer>
    <p>香港道教聯合會圓玄學院第三中學 · HKTA The Yuen Yuen Institute No.3 Secondary School</p>
  </footer>

  <!-- 自訂防呆對話框 (Custom Confirm Modal) -->
  <div class="custom-modal-overlay" id="custom-modal" style="display: none;">
    <div class="custom-modal-card">
      <div class="custom-modal-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
          <line x1="12" y1="9" x2="12" y2="13"></line>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
      </div>
      <div class="custom-modal-title" id="custom-modal-title">提交確認 / Submit Confirmation</div>
      <div class="custom-modal-body" id="custom-modal-body">確認要提交答案嗎？</div>
      <div class="custom-modal-actions">
        <button class="modal-btn-cancel" onclick="closeCustomModal()">取消 / Cancel</button>
        <button class="modal-btn-confirm" id="custom-modal-btn-confirm">確定 / Confirm</button>
      </div>
    </div>
  </div>

  <script>
    // 注入的資料
    const langMode = "/* {{LANG_MODE}} */";
    const quizMode = "/* {{QUIZ_MODE}} */";
    const orderMode = "/* {{ORDER_MODE}} */";
    const passingScore = parseInt("/* {{PASSING_SCORE}} */", 10);
    const themePrimaryColor = "/* {{THEME_PRIMARY}} */";
    const rawQuestions = /* {{QUESTIONS_DATA}} */;

    // {{QUIZ_JS}}
  </script>
</body>
</html>
